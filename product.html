<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Machinery Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: Arial, sans-serif; background: #f6f7f9; color: #172033; padding-bottom: 80px; }
        a { text-decoration: none; color: inherit; }

        header { background: white; padding: 14px 15px; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 1000; }
        .top-header { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 8px; color: #16a34a; font-size: 20px; font-weight: 800; }
        .logo-icon { width: 38px; height: 38px; background: #ecfdf3; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .header-cart { position: relative; font-size: 24px; }
        .cart-badge { position: absolute; top: -7px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px; background: #dc2626; color: white; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; }

        .back { display: block; max-width: 1100px; margin: 15px auto; padding: 0 15px; color: #16a34a; font-weight: bold; font-size: 14px; }

        .product-container { max-width: 1100px; margin: 0 auto 20px; padding: 15px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        .product-image-box { background: white; border-radius: 14px; overflow: hidden; border: 1px solid #eeeeee; min-height: 300px; display: flex; align-items: center; justify-content: center; position: relative; }
        .product-image-box img { width: 100%; height: 350px; object-fit: contain; display: block; }
        .product-placeholder { font-size: 110px; color: #16a34a; }
        .offer-badge { position: absolute; top: 12px; left: 12px; background: #dc2626; color: white; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; z-index: 2; }

        .product-info { background: white; padding: 20px; border-radius: 14px; border: 1px solid #eeeeee; }
        .product-info h1 { font-size: 22px; line-height: 1.35; margin-bottom: 4px; }
        .product-info .sub-title { font-size: 14px; color: #666; margin-bottom: 10px; }
        .rating { color: #f59e0b; font-size: 14px; margin-bottom: 15px; }
        .price { color: #16a34a; font-size: 26px; font-weight: 800; }
        .old-price { color: #999; text-decoration: line-through; margin-top: 4px; font-size: 13px; }
        .stock { color: #16a34a; background: #f0fdf4; display: inline-block; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin: 15px 0; }
        .description { color: #555; font-size: 14px; line-height: 1.7; margin-bottom: 18px; }

        .quantity-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .quantity { display: flex; align-items: center; width: fit-content; border: 1px solid #ddd; border-radius: 7px; overflow: hidden; margin-bottom: 18px; }
        .quantity button { width: 40px; height: 40px; border: none; background: #f3f4f6; font-size: 20px; cursor: pointer; }
        .quantity span { min-width: 45px; text-align: center; font-weight: bold; }

        .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .buttons button { border: none; border-radius: 8px; padding: 13px 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .cart-btn { background: #f59e0b; color: white; }
        .buy-btn { background: #16a34a; color: white; }

        .specifications { margin-top: 20px; background: #f9fafb; padding: 15px; border-radius: 10px; }
        .specifications h2 { font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #16a34a; padding-bottom: 5px; display: inline-block; }
        .spec-row { display: flex; justify-content: space-between; gap: 15px; padding: 8px 0; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
        .spec-row:last-child { border-bottom: none; }
        .spec-label { color: #666; text-transform: capitalize; }
        .spec-value { font-weight: bold; text-align: right; }

        .related-section { max-width: 1100px; margin: 0 auto; padding: 0 15px 25px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
        .section-title { font-size: 18px; font-weight: 800; }
        .view-all { color: #16a34a; font-size: 12px; font-weight: bold; }
        .related-products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .related-card { background: white; border: 1px solid #eeeeee; border-radius: 12px; overflow: hidden; }
        .related-image { height: 145px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-size: 45px; }
        .related-image img { width: 100%; height: 100%; object-fit: contain; }
        .related-info { padding: 10px; }
        .related-info h3 { font-size: 13px; line-height: 1.4; min-height: 37px; }
        .related-price { color: #16a34a; font-size: 15px; font-weight: 800; margin-top: 5px; }
        .related-btn { display: block; text-align: center; background: #16a34a; color: white; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 8px; }

        footer { background: #172033; color: white; text-align: center; padding: 28px 15px; }
        footer h3 { color: #4ade80; margin-bottom: 8px; }
        footer p { color: #d1d5db; font-size: 12px; margin: 6px 0; }

        .bottom-nav { position: fixed; left: 10px; right: 10px; bottom: 10px; height: 62px; background: rgba(255,255,255,.97); border: 1px solid #e5e7eb; border-radius: 17px; box-shadow: 0 5px 25px rgba(0,0,0,.15); display: grid; grid-template-columns: repeat(3, 1fr); z-index: 2000; }
        .bottom-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b7280; font-size: 11px; font-weight: 600; }
        .bottom-item span { font-size: 21px; margin-bottom: 2px; }
        .bottom-item.active { color: #16a34a; }

        @media (min-width: 768px) {
            .product-container { grid-template-columns: 1fr 1fr; align-items: start; padding-top: 10px; }
            .product-image-box { min-height: 450px; }
            .product-image-box img { height: 450px; }
            .related-products { grid-template-columns: repeat(4, 1fr); }
            .bottom-nav { max-width: 500px; left: 50%; right: auto; transform: translateX(-50%); }
        }
    </style>
</head>

<body>

<header>
    <div class="top-header">
        <a href="index.html" class="logo">
            <div class="logo-icon">⚙️</div> Machinery Shop
        </a>
        <a href="cart.html" class="header-cart">
            🛒 <span class="cart-badge" id="cart-count">0</span>
        </a>
    </div>
</header>

<a href="index.html" class="back">← Back to Home</a>

<main>
    <div class="product-container" id="product-details"></div>

    <section class="related-section" id="related-section">
        <div class="section-header">
            <h2 class="section-title">🔥 আরও সম্পর্কিত পণ্য</h2>
            <a href="index.html" class="view-all">View All →</a>
        </div>
        <div class="related-products" id="related-products"></div>
    </section>
</main>

<footer>
    <h3>⚙️ Machinery Shop</h3>
    <p>আপনার ব্যবসার প্রয়োজনীয় মেশিন এক জায়গায়</p>
    <p>🚚 সারা বাংলাদেশে Delivery</p>
</footer>

<nav class="bottom-nav">
    <a href="index.html" class="bottom-item active"><span>🏠</span> Home</a>
    <a href="index.html#searchInput" class="bottom-item"><span>🔍</span> Search</a>
    <a href="cart.html" class="bottom-item"><span>🛒</span> Cart</a>
</nav>

<script src="products.js"></script>
<script src="script.js"></script>

<script>
let selectedProduct = null;
let selectedQuantity = 1;

function getProductId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id") || "";
}

function findProduct() {
    if (typeof products === "undefined" || !Array.isArray(products)) return null;
    const id = getProductId();
    if (!id) return products[0] || null;
    return products.find(p => String(p.id) === String(id)) || null;
}

function loadProductDetails() {
    const container = document.getElementById("product-details");
    if (!container) return;

    selectedProduct = findProduct();

    if (!selectedProduct) {
        container.innerHTML = `
            <div class="product-info">
                <h1>Product পাওয়া যায়নি</h1>
                <p class="description">দুঃখিত, এই Product টি বর্তমানে পাওয়া যাচ্ছে না।</p>
                <a href="index.html" class="view-all">← হোমপেজে ফিরে যান</a>
            </div>
        `;
        const relSec = document.getElementById("related-section");
        if (relSec) relSec.style.display = "none";
        return;
    }

    const title = selectedProduct.bnName || selectedProduct.name;
    document.title = title + " - Machinery Shop";

    const priceText = selectedProduct.price > 0 ? `৳ ${Number(selectedProduct.price).toLocaleString()}` : "দাম জানতে কল করুন";
    const oldPriceText = (selectedProduct.oldPrice && selectedProduct.oldPrice > 0) ? `<div class="old-price">৳ ${Number(selectedProduct.oldPrice).toLocaleString()}</div>` : "";
    const badgeText = selectedProduct.badge ? `<span class="offer-badge">${selectedProduct.badge}</span>` : "";
    const stockStatus = selectedProduct.status === "available" ? "ইন স্টক (In Stock)" : "আউট অফ স্টক";

    container.innerHTML = `
        <div class="product-image-box">
            ${badgeText}
            ${getProductImage(selectedProduct)}
        </div>

        <div class="product-info">
            <h1>${title}</h1>
            ${selectedProduct.name !== selectedProduct.bnName ? `<div class="sub-title">${selectedProduct.name}</div>` : ''}
            <div class="rating">⭐⭐⭐⭐⭐ (${selectedProduct.rating || 5})</div>
            <div class="price">${priceText}</div>
            ${oldPriceText}
            <div class="stock">● ${stockStatus}</div>
            <p class="description">${selectedProduct.description || "এই পণ্যটি সম্পর্কে বিস্তারিত তথ্য জানতে আমাদের সাথে যোগাযোগ করুন।"}</p>
            
            <div class="quantity-title">পরিমাণ (Quantity)</div>
            <div class="quantity">
                <button type="button" onclick="changeProductQuantity(-1)">−</button>
                <span id="product-quantity">1</span>
                <button type="button" onclick="changeProductQuantity(1)">+</button>
            </div>
            
            <div class="buttons">
                <button class="cart-btn" type="button" onclick="addSelectedProductToCart()">🛒 Add to Cart</button>
                <button class="buy-btn" type="button" onclick="buyNow()">⚡ Buy Now</button>
            </div>
            
            ${renderSpecifications(selectedProduct)}
        </div>
    `;

    loadRelatedProducts();
}

function renderSpecifications(product) {
    let html = '<div class="specifications"><h2>Technical Specs & Details</h2>';
    
    if (product.seller) html += `<div class="spec-row"><span class="spec-label">Seller</span><span class="spec-value">${product.seller}</span></div>`;
    if (product.delivery) html += `<div class="spec-row"><span class="spec-label">Delivery</span><span class="spec-value">${product.delivery}</span></div>`;
    if (product.subCategory) html += `<div class="spec-row"><span class="spec-label">Category</span><span class="spec-value">${product.subCategory}</span></div>`;

    if (product.specifications && typeof product.specifications === "object") {
        Object.entries(product.specifications).forEach(([key, val]) => {
            html += `
                <div class="spec-row">
                    <span class="spec-label">${key}</span>
                    <span class="spec-value">${val}</span>
                </div>
            `;
        });
    }

    html += '</div>';
    return html;
}

function changeProductQuantity(change) {
    selectedQuantity += change;
    if (selectedQuantity < 1) selectedQuantity = 1;
    const quantityElement = document.getElementById("product-quantity");
    if (quantityElement) quantityElement.innerText = selectedQuantity;
}

function addSelectedProductToCart() {
    if (!selectedProduct) return;
    const name = selectedProduct.bnName || selectedProduct.name;
    for (let i = 0; i < selectedQuantity; i++) {
        addToCart(name, selectedProduct.price);
    }
}

function buyNow() {
    if (!selectedProduct) return;
    addSelectedProductToCart();
    window.location.href = "cart.html";
}

function loadRelatedProducts() {
    const container = document.getElementById("related-products");
    if (!container || !selectedProduct || typeof products === "undefined") return;

    const related = products.filter(p => p.id !== selectedProduct.id && p.category === selectedProduct.category).slice(0, 4);

    if (related.length === 0) {
        const relSec = document.getElementById("related-section");
        if (relSec) relSec.style.display = "none";
        return;
    }

    container.innerHTML = related.map(p => {
        const title = p.bnName || p.name;
        const priceText = p.price > 0 ? `৳ ${Number(p.price).toLocaleString()}` : "যোগাযোগ করুন";
        const page = p.page || `product.html?id=${p.id}`;
        return `
            <div class="related-card">
                <a href="${page}">
                    <div class="related-image">
                        ${getProductImage(p)}
                    </div>
                </a>
                <div class="related-info">
                    <h3>${title}</h3>
                    <div class="related-price">${priceText}</div>
                    <a href="${page}" class="related-btn">বিস্তারিত দেখুন</a>
                </div>
            </div>
        `;
    }).join("");
}

document.addEventListener("DOMContentLoaded", function() {
    loadProductDetails();
    updateCartCount();
});
</script>

</body>
</html>
